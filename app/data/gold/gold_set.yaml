- id: KIN-01
  source: kin
  source_url: https://m.kin.naver.com/qna/dirs/6080402/docs/480153149
  source_date: "2025-01-08"
  topic: 수급자격·권고사직
  question_type: multi_hop
  question: |-
    권고사직 후 실업급여 재수급이 가능한가요?
    이전에 실업급여를 받은 이력이 있고 여러 직장을 거쳐 현재 회사에서 권고사직 예정입니다. 최근 18개월 피보험단위기간이 180일 이상이면 다시 실업급여를 받을 수 있나요? 50세 미만이고 가입기간이 1~3년이면 150일을 받는 게 맞나요?
  answerability: full
  answer: >-
    다시 받을 수 있습니다. 이직일 이전 18개월(기준기간) 동안 피보험 단위기간이 합산 180일 이상이어야 하는데,
    이전에 구직급여를 받았다면 그 수급과 관련된 피보험자격 상실일 이전의 기간은 계산에서 빠집니다.
    경영 악화 등 회사 사정으로 사업주의 퇴직 권고를 받아 이직한 경우는 정당한 이직 사유입니다.
    이직일 현재 50세 미만이고 피보험기간이 1년 이상 3년 미만이면 소정급여일수는 150일이며,
    피보험기간에서도 이전에 구직급여를 받은 사업의 기간은 제외됩니다.
  evidence:
    - doc_id: easylaw_unemployment_benefit
      quote: '「고용보험법」 제40조제2항에 따른 기준기간(이하 "기준기간"이라 함) 동안의 피보험 단위기간(「고용보험법」 제41조에 따른 피보험 단위기간을 말함)이 합산하여 180일 이상일 것'
    - doc_id: easylaw_unemployment_benefit
      quote: 피보험 단위기간을 계산할 때에는 최후로 피보험자격을 취득한 날 이전에 구직급여를 받은 사실이 있는 경우에는 그 구직급여와 관련된 피보험자격 상실일 이전의 피보험 단위기간은 넣지 않습니다
    - doc_id: easylaw_unemployment_benefit
      quote: 다음의 어느 하나에 해당하는 사정으로 사업주로부터 퇴직을 권고 받거나 ... 경영의 악화, 인사 적체, 그 밖에 이에 준하는 사유가 발생한 경우
    - doc_id: easylaw_unemployment_benefit
      quote: "표: 소정급여일수의 산정 ... | 이직일 현재 연령 50세 미만 | 120일 | 150일 | 180일 | 210일 | 240일 |"
      alt:
        - doc_id: work24_employment_dream_booklet
          quote: "표: 구직급여의 소정급여일수(제50조제1항 관련) ... | 이직일 현재 연령 50세 미만 | 120일 | 150일 | 180일 | 210일 | 240일 |"
    - doc_id: easylaw_unemployment_benefit
      quote: 다만, 종전의 적용 사업의 피보험자격 상실로 인해 구직급여를 지급받은 사실이 있는 경우에는 그 종전의 적용 사업에서의 피보험기간은 제외됩니다.

- id: KIN-02
  source: kin
  source_url: https://m.kin.naver.com/qna/dirs/6080402/docs/480691507
  source_date: "2025-01-20"
  topic: 수급자격·이직확인서
  question_type: factoid
  question: |-
    도급계약 종료도 실업급여 수급사유가 되나요?
    무기계약직인데 도급계약 종료로 인원감축 통보를 받았습니다. 이직확인서 코드가 23-1 도급계약종료라면 실업급여 수급사유로 인정될 수 있나요?
  answerability: partial
  answer: >-
    이직확인서 코드(23-1)의 의미는 문서에 나와 있지 않습니다. 수급자격이 제한되는 것은 중대한 귀책사유로 해고되었거나
    정당한 사유 없이 자기 사정으로 이직한 경우입니다. 대량의 감원이 예정되어 있거나, 일부 사업의 폐지·경영 악화 등으로
    사업주로부터 퇴직을 권고받거나 인원 감축에 따라 이직한 경우는 정당한 이직 사유입니다. 회사 사정에 따른 인원감축으로
    이직했다면 제한 사유에 해당하지 않을 가능성이 높지만, 최종 판단은 고용센터가 합니다.
  note: 코드 체계는 문서 밖. 코드 의미를 지어내면 환각으로 본다.
  evidence:
    - doc_id: easylaw_unemployment_benefit
      quote: 피보험자가 다음의 어느 하나에 해당한다고 고용센터의 장이 인정하는 경우에는 수급자격이 없는 것으로 봅니다(「고용보험법」 제58조, ... 1. 중대한 귀책사유(歸責事由)로 해고된 피보험자로서 다음의 어느 하나에 해당하는 경우
    - doc_id: easylaw_unemployment_benefit
      quote: 사업장의 도산·폐업이 확실하거나 대량의 감원이 예정되어 있는 경우 ... 경영의 악화, 인사 적체, 그 밖에 이에 준하는 사유가 발생한 경우

- id: KIN-03
  source: kin
  source_url: https://m.kin.naver.com/qna/dirs/6080402/docs/481250878
  source_date: "2025-02-02"
  topic: 수급 중 근로
  question_type: factoid
  question: |-
    실업급여를 받으면서 알바하면 급여가 어떻게 계산되나요?
    실업급여 일액이 64,000원이고 수급 중 월 60시간 미만 알바로 60만 원을 벌면 실업급여는 어떻게 계산되나요? 28일 중 15일 일했다면 13일분만 지급되나요?
  answerability: partial
  answer: >-
    수급 중 아르바이트를 했다면 하루 소득 금액이나 명칭과 관계없이 실업인정 신청 때 근로 사실을 반드시 신고해야 합니다.
    월 소정근로시간 60시간 이상 근로, 일용근로, 근로 대가로 하루 구직급여일액 이상을 받는 경우 등은 취업으로 신고해야 하는
    경우에 해당합니다. 다만 아르바이트 소득에 따라 구직급여를 얼마나 줄여 지급하는지(계산 방법)는 문서에 나와 있지 않으므로
    고용센터(1350)에 확인해야 합니다.
  note: 소득에 따른 감액 계산 규칙은 문서 밖. "13일분만 지급" 같은 계산을 단정하면 환각으로 본다.
  evidence:
    - doc_id: work24_employment_dream_booklet
      quote: • 일한 사실이 있다면 실업인정 신청 시 근로사실을 신고해야 합니다. ... 일을 했으나 임금을 받지 못한 경우에도 근로사실 필수 신고
    - doc_id: easylaw_unemployment_benefit
      quote: 수급자격자는 실업의 인정을 받으려 하는 기간(이하 “실업인정대상기간”이라 함) 중에 다음의 어느 하나에 ... 근로 제공의 대가로 임금 등 어떠한 명칭으로든지 구직급여일액(「고용보험법」제46조) 이상을 수령하는 경우

- id: KIN-04
  source: kin
  source_url: https://m.kin.naver.com/qna/dirs/6080402/docs/481400084
  source_date: "2025-02-05"
  topic: 수급자격·권고사직
  question_type: factoid
  question: |-
    개인 귀책사유로 권고사직을 당하면 실업급여를 못 받나요?
    개인 귀책사유로 권고사직을 당하면 무조건 실업급여를 받을 수 없나요? 귀책사유의 정도에 따라 수급 여부가 달라질 수 있나요?
  answerability: full
  answer: >-
    무조건 못 받는 것은 아닙니다. 수급자격이 제한되는 것은 '중대한 귀책사유'가 있는 사람이 해고되지 않고 사업주의 권고로
    이직한 경우입니다. 중대한 귀책사유는 형법·직무 관련 법률 위반으로 금고 이상의 형을 받은 경우, 공금 횡령·기밀 유출 등으로
    사업에 막대한 지장이나 재산상 손해를 끼친 경우, 정당한 사유 없이 장기간 무단결근한 경우 등입니다.
    귀책사유가 이 기준에 해당하지 않으면 권고사직이어도 수급자격이 제한되지 않을 수 있으며, 판단은 고용센터가 합니다.
  evidence:
    - doc_id: easylaw_unemployment_benefit
      quote: 1. 중대한 귀책사유(歸責事由)로 해고된 피보험자로서 다음의 어느 하나에 해당하는 경우 ... 3) 정당한 사유 없이 근로계약 또는 취업규칙 등을 위반하여 장기간 무단 결근한 경우
    - doc_id: easylaw_unemployment_benefit
      quote: 2) 위 1.의 중대한 귀책사유가 있는 사람이 해고되지 않고 사업주의 권고로 이직한 경우

- id: KIN-05
  source: kin
  source_url: https://m.kin.naver.com/qna/dirs/6080402/docs/481595924
  source_date: "2025-02-09"
  topic: 실업인정
  question_type: factoid
  question: |-
    2차 실업인정 때 취업특강만 들어도 되나요?
    2차 실업인정 때 온라인 취업특강이나 입사지원 중 하나만 하면 되나요? 취업특강을 매주 하나씩 들어야 한다는 말도 있는데 일반수급자의 재취업활동 기준이 어떻게 되나요?
  answerability: full
  answer: >-
    일반수급자는 2~3차 실업인정 때 4주에 1회 재취업활동을 하면 되고, 구직활동(입사지원 등)과 구직외활동(취업특강 등) 중
    선택할 수 있습니다. 취업특강을 매주 들어야 하는 것은 아닙니다. 다만 취업특강과 온라인 취업특강(STEP)은 합쳐서 전체
    수급기간 중 총 2회까지만 인정됩니다. 4차~7차에는 4주 2회로 늘고 구직활동을 1회 이상 반드시 포함해야 합니다.
  evidence:
    - doc_id: work24_employment_dream_booklet
      quote: '| ① 일반수급자 | 2차~3차 실업인정일 | 4주 1회 | 2~3차는 구직활동, 구직외활동 선택 가능 |'
    - doc_id: work24_employment_dream_booklet
      quote: '• 취업특강: 재취업활동 1회로 인정. 단, 취업특강과 온라인 취업특강 (STEP)은 모두 합하여 전체 수급기간에서 총 2회까지만 수강 가능'
    - doc_id: work24_employment_dream_booklet
      quote: '| ① 일반수급자 | 4차~7차 실업인정일 | 4주 2회 | 구직활동 1회 이상 반드시 포함 |'

- id: KIN-06
  source: kin
  source_url: https://m.kin.naver.com/qna/dirs/6080402/docs/481884132
  source_date: "2025-02-15"
  topic: 실업인정·60세 이상
  question_type: multi_hop
  question: |-
    60세 이상은 취업특강만으로 실업인정을 받을 수 있나요?
    2025년 기준 60세 이상 정년퇴직자는 취업특강 영상이나 직업심리검사만으로 실업인정을 받을 수 있나요? 11차까지 수급한다면 횟수 제한 없이 가능한가요?
  answerability: partial
  answer: >-
    만 60세 이상(이직일 기준) 수급자는 전체 실업인정 기간에 4주 1회 재취업활동을 하면 되고, 2차부터 구직외활동도 선택할 수
    있습니다. 하지만 취업특강(온라인 포함)은 전체 수급기간 중 총 2회, 직업심리검사는 1회까지만 인정되고, 만 60~64세는
    구직외활동 횟수제한도 적용됩니다. 따라서 11차까지 취업특강이나 직업심리검사만으로 실업인정을 받을 수는 없고, 입사지원 같은
    구직활동 등 다른 재취업활동이 필요합니다. 1일 4시간 이상 봉사활동은 만 60~64세는 전체 수급기간 중 1회, 만 65세 이상은
    횟수 제한 없이 인정됩니다. 이 내용은 취업드림수첩(2026년 2월 발행) 기준이며, 질문한 2025년 당시 기준은 제공된 문서로 확인할 수 없습니다.
  note: 질문은 2025년 기준을 묻지만 문서는 2026년 기준이다. 문서 기준일을 밝히지 않고 2025년 기준인 것처럼 답하면 틀린 것으로 본다.
  evidence:
    - doc_id: work24_employment_dream_booklet
      quote: '| ③ 만 60세 이상(이직일 기준) 및 장애인 | 전체 실업인정 기간 | 4주 1회 | ... 단, 만 60세~64세 수급자는 구직외활동 횟수제한 적용됨 |'
    - doc_id: work24_employment_dream_booklet
      quote: '• 취업특강: 재취업활동 1회로 인정. 단, 취업특강과 온라인 취업특강 (STEP)은 모두 합하여 전체 수급기간에서 총 2회까지만 수강 가능'
    - doc_id: work24_employment_dream_booklet
      quote: '• 직업심리검사, 심리안정프로그램 참여: 재취업활동 1회로 인정. 단, 직업심리검사와 심리안정프로그램은 전체 수급기간에서 1회까지만 재취업활동으로 인정'
    - doc_id: work24_employment_dream_booklet
      quote: '* 만 60세~64세 수급자는 전제 수급기간에서 1회까지만 재취업활동으로 인정 가능하며, 만 65세 이상 및 장애인 수급자는 횟수제한 없음'

- id: KIN-07
  source: kin
  source_url: https://m.kin.naver.com/qna/dirs/6080402/docs/482112133
  source_date: "2025-02-20"
  topic: 조기재취업수당
  question_type: factoid
  question: |-
    이전 직장에 재취업해도 조기재취업수당을 받을 수 있나요?
    10개월 근무 후 계약종료로 실업급여를 받고 있는데 이전과 동일한 직장에 다시 취업하게 됐습니다. 이 경우 조기재취업수당을 받을 수 있나요?
  answerability: full
  answer: >-
    받을 수 없습니다. 수급자가 마지막으로 이직한 사업의 사업주에게 다시 고용된 경우는 조기재취업수당 지급 대상에서 제외됩니다.
  evidence:
    - doc_id: work24_employment_dream_booklet
      quote: ① 수급자가 마지막으로 이직한 사업의 사업주에게 다시 고용된 경우
      alt:
        - doc_id: easylaw_unemployment_benefit
          quote: 1. 최후에 이직한 사업의 사업주나 그와 관련된 사업주로서 해당 수급자격자의 최종 이직 당시의 사업주와 합병·분할되거나 그 사업을 넘겨받은 사업주에게 재고용된 경우

- id: KIN-08
  source: kin
  source_url: https://m.kin.naver.com/qna/dirs/6080402/docs/482155716
  source_date: "2025-02-21"
  topic: 수급자격·계약만료
  question_type: factoid
  question: |-
    같은 회사에서 재계약한 뒤 계약만료되면 실업급여를 받을 수 있나요?
    같은 회사에서 퇴직 후 바로 재계약해 공백 없이 근무했고, 1년 계약이 끝나 계약만료로 퇴사합니다. 같은 회사에서 계속 근무한 경우에도 계약만료를 이유로 실업급여를 받을 수 있나요?
  answerability: full
  answer: >-
    계약기간 만료로 회사를 계속 다닐 수 없게 된 경우는 정당한 이직 사유이므로, 같은 회사에서 재계약해 일했더라도 계약만료를
    이유로 수급자격이 제한되지 않습니다. 이직일 이전 18개월 동안 피보험 단위기간이 합산 180일 이상 등 다른 수급요건도 충족하면
    받을 수 있습니다.
  evidence:
    - doc_id: easylaw_unemployment_benefit
      quote: 정년의 도래나 계약기간의 만료로 회사를 계속 다닐 수 없게 된 경우
    - doc_id: easylaw_unemployment_benefit
      quote: '「고용보험법」 제40조제2항에 따른 기준기간(이하 "기준기간"이라 함) 동안의 피보험 단위기간(「고용보험법」 제41조에 따른 피보험 단위기간을 말함)이 합산하여 180일 이상일 것'

- id: KIN-09
  source: kin
  source_url: https://m.kin.naver.com/qna/dirs/60804/docs/482283788
  source_date: "2025-02-24"
  topic: 수급 중 근로·소득신고
  question_type: procedural
  question: |-
    실업급여 신청 전 단기알바 소득도 신고해야 하나요?
    이직확인서 처리 전 이틀 동안 단기알바를 했고 알바비는 이후에 입금됐습니다. 1차 실업인정일에 이 단기알바 소득을 신고해야 하나요?
  answerability: full
  answer: >-
    근로 사실 신고는 소득을 받은 날이 아니라 일한 날(근로제공일)을 기준으로 합니다. 실업인정대상기간은 대기기간(수급자격
    신청일부터 7일) 종료 다음 날부터이므로, 알바한 이틀이 그 기간 안에 있으면 1차 실업인정 때 신고해야 합니다.
    신고 대상인지는 고용센터가 검토하므로, 모든 근로와 소득은 신고하는 것이 원칙입니다.
  evidence:
    - doc_id: work24_employment_dream_booklet
      quote: ※ 신고는 근로제공일 기준입니다.(소득 수령일 기준이 아닙니다.)
    - doc_id: work24_employment_dream_booklet
      quote: • 재취업활동을 할 수 있는 실업인정 대상기간은 대기기간(수급자격 신청일 부터 7일간) 종료 다음 날부터이며, 지난번 실업인정일의 다음날부터 이번 실업인정일 당일까지입니다.
    - doc_id: work24_employment_dream_booklet
      quote: • 신고대상에 해당되는지 여부는 고용센터에서 검토하오니, 모든 형태의 근로제공 및 어떠한 명칭이든지 소득발생은 반드시 신고해 주시기 바랍니다.

- id: KIN-10
  source: kin
  source_url: https://m.kin.naver.com/qna/dirs/6080402/docs/482593050
  source_date: "2025-03-02"
  topic: 수급자격·금액·기간
  question_type: multi_hop
  question: |-
    자진퇴사 후 계약직으로 근무하면 실업급여를 받을 수 있나요?
    2년 1개월 근무한 회사를 자진퇴사한 뒤 5개월 계약직으로 근무할 예정입니다. 계약만료 후 실업급여 신청이 가능한가요? 가능하다면 몇 개월 동안 얼마 정도 받을 수 있나요?
  answerability: full
  answer: >-
    신청할 수 있습니다. 이전 이직과 관련해 구직급여를 받은 적이 없다면 수급자격은 마지막으로 이직한 사업(계약직)을 기준으로
    판단하고, 계약기간 만료는 정당한 이직 사유입니다. 이직일 이전 18개월 동안 두 직장의 피보험 단위기간을 합해 180일 이상이면
    됩니다. 이전 직장의 피보험자격 상실 후 3년 이내에 새로 취득했으므로 피보험기간은 합산되어 약 2년 6개월(1년 이상 3년 미만)이고,
    이직일 현재 50세 미만이면 150일간 받습니다. 하루 금액(구직급여일액)은 기초일액(이직 전 평균임금)의 60%이며 하루 68,100원을
    넘을 수 없습니다.
  evidence:
    - doc_id: easylaw_unemployment_benefit
      quote: 수급자격의 인정 신청인이 다음의 요건을 모두 갖춘 경우에는 마지막에 이직(離職)한 사업을 기준으로 ... 마지막 이직 이전의 이직과 관련하여 구직급여를 받은 사실이 없을 것
    - doc_id: easylaw_unemployment_benefit
      quote: 정년의 도래나 계약기간의 만료로 회사를 계속 다닐 수 없게 된 경우
    - doc_id: easylaw_unemployment_benefit
      quote: '「고용보험법」 제40조제2항에 따른 기준기간(이하 "기준기간"이라 함) 동안의 피보험 단위기간(「고용보험법」 제41조에 따른 피보험 단위기간을 말함)이 합산하여 180일 이상일 것'
    - doc_id: easylaw_unemployment_benefit
      quote: 종전의 적용 사업에서 피보험자격을 상실한 사실이 있고 그 상실한 날부터 3년 이내에 현재 적용 사업에서 피보험자격을 취득한 경우에는 종전의 적용 사업에서의 피보험기간을 합산하여 피보험기간을 계산합니다
    - doc_id: easylaw_unemployment_benefit
      quote: "표: 소정급여일수의 산정 ... | 이직일 현재 연령 50세 미만 | 120일 | 150일 | 180일 | 210일 | 240일 |"
      alt:
        - doc_id: work24_employment_dream_booklet
          quote: "표: 구직급여의 소정급여일수(제50조제1항 관련) ... | 이직일 현재 연령 50세 미만 | 120일 | 150일 | 180일 | 210일 | 240일 |"
    - doc_id: easylaw_unemployment_benefit
      quote: 구직급여 총 수급액 = 구직급여일액(기초일액 X 60%) X 소정급여일수
    - doc_id: easylaw_unemployment_benefit
      quote: 구직급여일액은 기초일액 상한인 11만3500원의 100분의 60을 곱한 금액인 6만8100원을 초과할 수 없습니다

- id: KIN-11
  source: kin
  source_url: https://m.kin.naver.com/qna/dirs/6080402/docs/482908479
  source_date: "2025-03-09"
  topic: 수급자격·이직확인서
  question_type: multi_hop
  question: |-
    1개월 미만 단기계약직도 이직확인서를 받을 수 있나요?
    정규직을 자진퇴사한 뒤 단기 계약직으로 일하고 계약만료되면 실업급여를 신청하려고 합니다. 계약직은 반드시 1개월 이상 근무해야 하나요? 1개월 미만이어도 이직확인서를 받을 수 있나요?
  answerability: partial
  answer: >-
    1개월 미만 동안 고용되는 사람은 일용근로자에 해당합니다. 마지막 이직 당시 일용근로자로서 피보험 단위기간이 1개월 미만인
    사람이 수급자격을 갖추지 못하면, 일용근로자가 아닌 근로자로서 마지막으로 이직한 사업(이 경우 자진퇴사한 정규직)을 기준으로
    수급자격을 판단합니다. 또 일용근로자는 기준기간 중 다른 사업에서 수급자격 제한 사유(자진퇴사 등)로 이직한 적이 있으면
    그 기간 중 90일 이상을 일용근로자로 일해야 합니다. 정당한 사유 없는 자진퇴사는 수급자격 제한 사유이므로, 1개월 미만
    단기계약 만료만으로는 수급자격을 인정받기 어렵습니다. 이직확인서는 고용센터가 필요하면 이전 사업주에게 제출을 요청하며,
    요청받은 사업주는 제출해야 합니다. 근로자가 직접 이직확인서를 발급받을 수 있는지는 문서에 나와 있지 않습니다.
  note: 근로자가 이직확인서를 직접 발급받는 절차는 문서 밖. 문서에는 고용센터가 사업주에게 제출을 요청하는 규정만 있다.
  evidence:
    - doc_id: easylaw_unemployment_benefit
      quote: 다만, 마지막 이직 당시 일용근로자로서 피보험 단위기간이 1개월 미만인 사람이 수급자격을 갖추지 못한 ... 1개월 미만 동안 고용되는 사람을 말합니다
    - doc_id: easylaw_unemployment_benefit
      quote: 최종 이직 당시의 기준기간의 피보험 단위기간 동안 다른 사업에서 수급자격의 제한 사유(「고용보험법」 제58조)에 해당하는 사유로 이직한 사실이 있는 경우에는 그 피보험 단위기간 중 90일 이상을 일용근로자로 근로하였을 것
    - doc_id: easylaw_unemployment_benefit
      quote: 2. 자기 사정으로 이직한 피보험자로서 다음의 어느 하나에 해당하는 경우 ... 3) 그 밖에 정당한 사유에 해당하지 않는 사유로 이직한 경우
    - doc_id: easylaw_unemployment_benefit
      quote: 고용센터의 장은 신청인에 대한 수급자격의 인정 여부를 결정하기 위해 필요하면 신청인이 이직하기 전 사업의 사업주에게 이직확인서의 제출을 요청할 수 있으며, 요청받은 사업주는 이직확인서를 제출해야 합니다

- id: KIN-12
  source: kin
  source_url: https://m.kin.naver.com/qna/dirs/6080402/docs/482927840
  source_date: "2025-03-10"
  topic: 실업인정·구직활동
  question_type: multi_hop
  question: |-
    입사지원과 직업심리검사를 같은 날 해도 각각 인정되나요?
    5차 실업인정을 위해 입사지원과 직업심리검사를 같은 날 진행해도 각각 재취업활동으로 인정되나요? 하루에 한 건만 인정된다는 기준은 구직활동에만 적용되나요?
  answerability: full
  answer: >-
    각각 인정되지 않습니다. 같은 날의 재취업활동은 1건만 인정되며, 이 기준은 구직활동뿐 아니라 직업심리검사 같은 구직외활동을
    포함한 재취업활동 전체에 적용됩니다. 일반수급자는 4차~7차에 4주 2회 재취업활동을 해야 하고 그중 구직활동이 1회 이상
    포함되어야 하므로, 입사지원과 직업심리검사는 다른 날에 해야 합니다. 직업심리검사는 전체 수급기간 중 1회만 인정됩니다.
  evidence:
    - doc_id: work24_employment_dream_booklet
      quote: '- 같은 날의 재취업활동은 1건만 인정됩니다.'
    - doc_id: work24_employment_dream_booklet
      quote: '| ① 일반수급자 | 4차~7차 실업인정일 | 4주 2회 | 구직활동 1회 이상 반드시 포함 |'
    - doc_id: work24_employment_dream_booklet
      quote: '• 직업심리검사, 심리안정프로그램 참여: 재취업활동 1회로 인정. 단, 직업심리검사와 심리안정프로그램은 전체 수급기간에서 1회까지만 재취업활동으로 인정'

- id: KIN-13
  source: kin
  source_url: https://m.kin.naver.com/qna/dirs/6080402/docs/483244860
  source_date: "2025-03-18"
  topic: 실업인정·구직활동
  question_type: unanswerable
  question: |-
    같은 회사의 입사지원과 면접은 구직활동 2회로 인정되나요?
    한 회사에 입사지원한 뒤 실제 면접까지 봤다면 입사지원 1회와 면접 1회로 각각 구직활동이 인정되나요, 아니면 지원과 면접을 합쳐 1회로 인정되나요?
  answerability: none
  answer: >-
    같은 회사에 입사지원과 면접을 한 경우 구직활동을 몇 회로 인정하는지는 제공된 문서에 나와 있지 않습니다.
    고용센터 실업인정 담당자나 고객상담센터(1350)에 확인해야 합니다.
  note: >-
    문서에는 "동일 사업장만을 반복하여 구직활동을 하는 경우"를 인정하지 않는다는 규정만 있고 지원·면접의 횟수 산정 기준은 없다.
    이 규정을 근거로 "1회"라고 단정하면 환각으로 본다.
  evidence: []

- id: KIN-14
  source: kin
  source_url: https://m.kin.naver.com/mobile/qna/detail.naver?d1id=6&dirId=6080402&docId=483618706
  source_date: "2025-03-28"
  topic: 취업 후 재실업
  question_type: procedural
  question: |-
    재취업 후 계약이 끝나면 남은 실업급여를 다시 받을 수 있나요?
    실업급여 수급기간이 3개월 남은 상태에서 6개월 계약직으로 취업합니다. 계약만료 후 남아 있던 실업급여를 다시 받을 수 있나요, 아니면 새로운 수급자격을 충족해야 하나요?
  answerability: full
  answer: >-
    당초 수급기간(이직일 다음 날부터 12개월)이 끝나지 않았다면 남은 실업급여를 받을 수 있습니다. 이직한 다음 날부터 7일 이내에
    고용센터를 방문해 재실업신고를 해야 하고, 늦어지면 그만큼 소정급여일수가 소멸됩니다. 취업했던 기간의 구직급여는 지급되지
    않습니다. 수급기간 중 새로 수급자격(180일 요건 등)을 인정받으면 새 수급자격을 기준으로 구직급여를 받습니다.
  evidence:
    - doc_id: work24_employment_dream_booklet
      quote: '- 당초 수급기간이 만료되지 않았다면 재실업신고 시점에 따라 남아있는 ... 신고가 지연되면 그만큼 소정급여일수가 소멸되니 유의하세요.'
    - doc_id: easylaw_unemployment_benefit
      quote: “수급기간”이란 구직급여의 수급자격과 관련된 이직(離職)일의 다음 날부터 계산하기 시작해서 12개월의 기간을 말합니다
    - doc_id: easylaw_unemployment_benefit
      quote: 수급자격자가 수급기간(「고용보험법」 제48조) 또는 연장급여 수급기간(「고용보험법」 제54조제1항)에 새로 수급자격의 인정을 받은 경우에는 새로 인정받은 수급자격을 기준으로 구직급여를 받습니다

- id: KIN-15
  source: kin
  source_url: https://m.kin.naver.com/qna/dirs/6080402/docs/484053424
  source_date: "2025-04-09"
  topic: 부정수급
  question_type: multi_hop
  question: |-
    과거 실업급여 부정수급을 자진신고하면 어떻게 되나요?
    2019년에 받은 실업급여가 부정수급이었던 것을 2025년 4월에 자진신고했습니다. 이런 경우 처벌이나 추가징수는 어떻게 되고 공소시효가 있나요?
  answerability: partial
  answer: >-
    공소시효와, 2019년의 부정행위에 어느 시점의 규정이 적용되는지는 문서에 나와 있지 않습니다. 아래는 문서(2026년 기준)의
    규정입니다. 부정하게 받은 구직급여는 반환해야 하고 추가징수가 원칙이지만, 본인이나 사업장에 대한
    조사 전에 부정행위를 자진 신고한 사람은 추가징수가 면제될 수 있습니다. 근로 사실을 신고하지 않은 부정행위라면 조사 전
    자진신고 시(1회 한정) 근로를 제공한 날에 대해 받은 구직급여만 반환합니다. 형사처벌 규정은 3년 이하의 징역 또는 3천만원 이하의
    벌금(사업주와 공모 시 5년 이하의 징역 또는 5천만원 이하의 벌금)입니다. 구체적인 처분은 고용센터에 확인해야 합니다.
  note: 공소시효와 행위 시점(2019년)에 적용되는 규정은 문서 밖. 이를 지어내거나 2026년 규정이 그대로 적용된다고 단정하면 환각으로 본다.
  evidence:
    - doc_id: easylaw_unemployment_benefit
      quote: 거짓이나 그 밖의 부정한 방법으로 구직급여를 지급받은 사람에게 다음의 기준에 따라 ... 1. 지급받은 구직급여 전부의 반환할 것
    - doc_id: easylaw_unemployment_benefit
      quote: 3. 위 1)의 사유에 해당하는 사람이 고용센터의 장이 본인이나 사업장에 대한 조사를 하기 전까지 ... (1회의 자진신고로 한정함)
    - doc_id: easylaw_unemployment_benefit
      quote: 다음의 어느 하나에 해당하는 사람은 추가징수가 면제될 수 있습니다 ... 부정행위자 본인이나 사업장에 대한 조사 전까지 부정행위를 자진 신고한 사람
    - doc_id: easylaw_unemployment_benefit
      quote: 거짓이나 그 밖의 부정한 방법으로 실업급여 등을 받은 사람은 3년 이하의 징역 또는 3천만원 이하의 벌금에 처해집니다
    - doc_id: work24_employment_dream_booklet
      quote: 형사처벌 * 사업주와 공모 시 5년 이하의 징역 또는 5천만원 이하의 벌금

- id: KIN-16
  source: kin
  source_url: https://kin.naver.com/qna/detail.naver?d1id=6&dirId=6080402&docId=485245138
  source_date: "2025-05-15"
  topic: 특수상황·해외여행
  question_type: procedural
  question: |-
    해외여행 예정인데 실업급여를 먼저 신청해도 되나요?
    2년 계약직 근무 후 퇴사했고 한 달 뒤 약 3주간 해외여행 예정입니다. 여행 전에 실업급여를 신청해도 되나요? 아니면 여행을 다녀온 뒤 신청해야 하나요?
  answerability: full
  answer: >-
    여행 전에 신청할 수는 있지만, 해외에 체류하면서 실업인정을 신청할 수 없고 여행 목적의 출국은 해외 취업 목적으로 보지 않습니다.
    취업이 목적이 아닌 해외 체류 중에 실업급여를 받으면 부정수급이 됩니다. 수급 중 출국한다면 고용센터 담당자에게 미리 알려야
    합니다. 구직급여 신청 기한 자체는 없지만 이직일 다음 날부터 12개월이 지나면 남은 구직급여를 받을 수 없으므로, 그 안에
    소정급여일수를 받을 수 있다면 귀국 후 신청하는 것이 안전합니다.
  evidence:
    - doc_id: work24_employment_dream_booklet
      quote: • 실업급여 수급 중에 해외출국을 할 경우에는 고용센터 담당자에게 사전에 통보해 주시기 바랍니다.
    - doc_id: work24_employment_dream_booklet
      quote: • 해외체류 중 실업인정 신청은 불가합니다. ... 출국은 해외 취업 목적으로 보지 않습니다.
    - doc_id: easylaw_unemployment_benefit
      quote: A. 회사를 그만둔 후 언제까지 구직급여 수급을 신청해야 하는지에 대한 제한은 없지만, 이직일 다음날부터 12개월이 초과하면 소정급여일수가 남아 있더라도 남은 구직급여를 받을 수 없습니다.

- id: KIN-17
  source: kin
  source_url: https://m.kin.naver.com/qna/dirs/6080402/docs/485351009
  source_date: "2025-05-19"
  topic: 수급자격·180일
  question_type: factoid
  question: |-
    실업급여 180일은 실제 출근일 기준인가요?
    주 4일, 주 15시간 이상 근무하고 있습니다. 실업급여의 180일 요건은 실제로 출근한 날짜가 180일 이상이어야 한다는 뜻인가요?
  answerability: full
  answer: >-
    실제 출근일만 세는 것은 아닙니다. 180일은 '보수 지급의 기초가 된 날'(피보험 단위기간)을 합한 것으로, 근로한 날과 근로하지
    않았더라도 임금을 받은 유급휴일, 휴업수당을 받은 날이 포함됩니다. 유급이 아닌 휴일은 빠지므로 취업규칙이나 근로계약서를
    확인해야 합니다.
  evidence:
    - doc_id: easylaw_unemployment_benefit
      quote: 근로자의 피보험 단위기간은 피보험기간 중 보수 지급의 기초가 된 날을 합하여 계산합니다
    - doc_id: easylaw_unemployment_benefit
      quote: A. 피보험단위기간은 피보험기간 중 보수지급의 기초가 된 날을 합하여 계산하는데 ... 취업규칙이나 근로계약서를 반드시 확인하시기 바랍니다.
    - doc_id: easylaw_unemployment_benefit
      quote: '「고용보험법」 제40조제2항에 따른 기준기간(이하 "기준기간"이라 함) 동안의 피보험 단위기간(「고용보험법」 제41조에 따른 피보험 단위기간을 말함)이 합산하여 180일 이상일 것'

- id: KIN-18
  source: kin
  source_url: https://kin.naver.com/qna/detail.naver?dirId=6080402&docId=485629978
  source_date: "2025-05-28"
  topic: 실업인정·직업훈련
  question_type: factoid
  question: |-
    내일배움카드 직업훈련도 실업인정 재취업활동으로 인정되나요?
    5·6차 실업인정 때 내일배움카드로 요양보호사 교육을 받는 것도 재취업활동으로 인정되나요? 30시간 정도의 자격과정도 인정되는지, 직업훈련 인정 횟수 제한도 궁금합니다.
  answerability: full
  answer: >-
    인정될 수 있습니다. 구직 희망 직종과 관련 있고 출결관리와 교육시간 확인이 가능한 훈련과정이면, 해당 실업인정기간(통상 28일)
    중 교육시간이 15시간 이상 30시간 미만이면 구직활동 1회, 30시간 이상이면 실업인정 차수와 관계없이 구직활동 횟수를 충족한
    것으로 인정됩니다. 국민내일배움카드 온라인 훈련도 훈련수강증명서와 정확한 출결기록을 낼 수 있으면 대면 훈련과 같이 인정됩니다.
    실업인정 때 수강증명서와 실업인정 대상기간 내 출석부 사본을 제출해야 합니다.
  evidence:
    - doc_id: work24_employment_dream_booklet
      quote: 직업훈련은 구직외활동이나, 수급자의 구직희망 직종과 관련이 있으며 ... 구직활동 횟수를 충족한 것으로 인정됩니다.
    - doc_id: work24_employment_dream_booklet
      quote: • 우리부 주관 온라인 훈련과정(국민내일배움카드 훈련, KDT 훈련 등)에 한해 ... 대면 직업훈련과 동일하게 인정
    - doc_id: work24_employment_dream_booklet
      quote: '- 수급 중 훈련을 수강하는 경우, ①실업인정 신청서, ... ③실업인정 대상기간 내 출석부 사본을 제출하여야 합니다.'

- id: KIN-19
  source: kin
  source_url: https://m.kin.naver.com/qna/dirs/6080402/docs/486308733
  source_date: "2025-06-19"
  topic: 조기재취업수당
  question_type: multi_hop
  question: |-
    소정급여일수 180일 중 88일이 남으면 조기재취업수당을 받을 수 있나요?
    총 소정급여일수 180일 중 88일이 남은 상태에서 다음 주 취업 예정입니다. 조기재취업수당 대상이 되나요? 대상이 아니라면 취업 전날까지의 미취업 일수는 구직급여를 받을 수 있나요?
  answerability: full
  answer: >-
    대상이 되지 않습니다. 조기재취업수당은 재취업한 날의 전날을 기준으로 소정급여일수의 1/2 이상(180일이면 90일 이상)을 남기고
    재취업해야 받을 수 있는데, 88일은 1/2 미만입니다. 취업 전날까지의 구직급여는 취업한 날부터 2개월 이내에 취업사실을 신고하면
    받을 수 있습니다. 취업한 뒤 처음 돌아오는 실업인정일에는 실업인정 신청이 아니라 취업사실 신고를 해야 합니다.
  evidence:
    - doc_id: work24_employment_dream_booklet
      quote: ⑤ 재취업한 날의 전날을 기준으로 남아있는 소정급여일수가 1/2 미만인 경우
      alt:
        - doc_id: easylaw_unemployment_benefit
          quote: 실업의 신고일부터 14일이 지난 후 재취업한 날의 전날을 기준으로 소정급여일수를 2분의 1 이상 남기고 재취업한 경우
    - doc_id: work24_employment_dream_booklet
      quote: • 취업 또는 사업을 시작한 수급자는 근로계약서나 재직증명서 ... 취업 전날까지의 구직급여를 받을 수 있습니다.
    - doc_id: work24_employment_dream_booklet
      quote: • (유의) 실업인정일에 취업하였거나 ... 취업을 신고하여야 합니다!

