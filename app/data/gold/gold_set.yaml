- id: KIN-21
  source: kin
  source_url: https://m.kin.naver.com/qna/dirs/60804/docs/479873444
  source_date: "2025-01-02"
  topic: 수급자격·직장 내 괴롭힘
  question_type: factoid
  question: |-
    직장 내 괴롭힘 때문에 자진퇴사했는데 실업급여를 받을 수 있나요?
    직장 내 괴롭힘을 신고해 인정받은 뒤 퇴사했습니다. 그런데 회사에서 고용보험 상실사유를 개인사정에 의한 자진퇴사로 신고했다고 합니다. 직장 내 괴롭힘 때문에 퇴사했다는 자료가 있다면 실업급여를 받을 수 있을까요?
  answerability: partial
  answer: >-
    「근로기준법」상 직장 내 괴롭힘을 당해 이직한 경우는 정당한 이직 사유입니다. 수급자격 제한 여부는 고용센터의 장이 인정하는
    것이므로, 괴롭힘으로 이직한 사실이 객관적으로 인정되고 다른 수급요건도 충족하면 받을 수 있습니다. 회사가 신고한 상실사유를
    정정하는 절차는 문서에 나와 있지 않으므로 고용센터에 확인해야 합니다.
  note: 회사가 신고한 상실사유를 정정하는 절차는 문서 밖.
  evidence:
    - doc_id: easylaw_unemployment_benefit
      quote: 「근로기준법」 제76조의2에 따른 직장 내 괴롭힘을 당한 경우
    - doc_id: easylaw_unemployment_benefit
      quote: 피보험자가 다음의 어느 하나에 해당한다고 고용센터의 장이 인정하는 경우에는 수급자격이 없는 것으로 봅니다(「고용보험법」 제58조,

- id: KIN-22
  source: kin
  source_url: https://m.kin.naver.com/qna/dirs/6080402/docs/481355509
  source_date: "2025-02-04"
  topic: 수급자격·질병퇴사
  question_type: multi_hop
  question: |-
    항암치료 부작용으로 퇴사하면 실업급여를 받을 수 있나요?
    항암치료를 받고 있는데 치료 부작용 때문에 정상적으로 근무하기 어려워 퇴사를 생각하고 있습니다. 회사에서 휴직이나 업무전환이 어렵다면 질병을 이유로 자진퇴사한 경우에도 실업급여를 받을 수 있나요?
  answerability: full
  answer: >-
    질병 등으로 주어진 업무를 수행하기 곤란하고 회사 사정상 업무 전환이나 휴직이 허용되지 않아 이직한 것이 의사 소견서,
    사업주 의견 등으로 객관적으로 인정되면 정당한 이직 사유이므로, 다른 수급요건도 충족하면 받을 수 있습니다. 다만 구직급여는 일할 의사와 능력이 있어야 하므로,
    질병으로 통상 취업이 곤란한 동안에는 실업이 인정되지 않습니다. 치료 때문에 당장 일할 수 없다면 수급기간(이직일 다음 날부터
    12개월) 중에 본인의 질병을 사유로 수급기간 연기를 신고할 수 있습니다.
  evidence:
    - doc_id: easylaw_unemployment_benefit
      quote: 체력의 부족, 심신장애, 질병, 부상, 시력·청력·촉각의 감퇴 등으로 피보험자가 주어진 업무를 수행하는 것이 곤란하고, 기업의 사정상 업무종류의 전환이나 휴직이 허용되지 않아 이직한 것이 의사의 소견서, 사업주 의견 등에 근거하여 객관적으로 인정되는 경우
    - doc_id: easylaw_unemployment_benefit
      quote: 2. 질병·부상 등 정신적·육체적 조건으로 통상 취업이 곤란하다고 인정되는 경우
    - doc_id: easylaw_unemployment_benefit
      quote: 12개월의 수급기간 중 다음의 사유로 취업할 수 없는 사람이 ... 본인의 질병이나 부상

- id: KIN-23
  source: kin
  source_url: https://kin.naver.com/qna/detail.naver?d1id=6&dirId=6080402&docId=481900151
  source_date: "2025-02-15"
  topic: 실업인정·실업인정일 누락
  question_type: procedural
  question: |-
    마지막 실업인정일에 신청을 못 했는데 실업급여를 받을 수 있나요?
    마지막 실업인정일이었는데 날짜를 깜빡해서 인터넷 실업인정 신청을 하지 못했습니다. 지정된 실업인정일이 지난 뒤라도 고용센터에 방문하거나 별도로 신청하면 해당 기간의 실업급여를 받을 수 있나요?
  answerability: full
  answer: >-
    받을 수 있습니다. 실업인정일을 잊어버린 경우(수급자격자의 착오)에는 그 실업인정일부터 14일 이내에 고용센터에 출석해
    실업인정일 변경을 신청할 수 있습니다. 다만 착오로 인한 변경은 수급기간 중 1회만 가능합니다. 마지막 회차의 재취업활동은
    수급만료일까지 한 것만 인정되며, 수급만료일 이후에 한 재취업활동으로는 실업인정을 신청할 수 없습니다.
  evidence:
    - doc_id: work24_employment_dream_booklet
      quote: • (중요) 수급자격자의 착오(실업인정일을 잊어버리거나 부득이하지 않은 개인 사정)로 ... 내 1회만 가능합니다.
      alt:
        - doc_id: easylaw_unemployment_benefit
          quote: 수급자격자의 착오로 실업인정일에 고용센터에 출석할 수 없었던 사람으로서 해당 실업인정일부터 14일 이내에 출석하여 실업인정일의 변경을 신청한 사람(해당 수급자격자의 수급기간 내에 한 번만 인정함)
    - doc_id: work24_employment_dream_booklet
      quote: 수급만료일 이후에 수행한 재취업활동으로는 실업인정을 신청할 수 없습니다.

- id: KIN-24
  source: kin
  source_url: https://m.kin.naver.com/qna/dirs/6080402/docs/483558611
  source_date: "2025-03-26"
  topic: 반복수급·감액
  question_type: factoid
  question: |-
    5년 안에 실업급여를 여러 번 받으면 반복수급자로 감액되나요?
    이전에 실업급여를 받은 적이 있고 다시 실업급여를 신청하려고 합니다. 최근 5년 동안 여러 차례 수급한 경우 반복수급자로 분류되는 기준이 무엇인가요? 반복수급자가 되면 구직급여가 얼마나 감액되는지도 궁금합니다.
  answerability: partial
  answer: >-
    반복수급자는 이직일 기준 직전 5년간 3회 이상 구직급여를 받은 사람입니다. 반복수급자는 매 회차 고용센터에 출석해야 하고,
    2차에 재취업활동계획서(IAP)를 세우며, 3차부터는 구직활동만 인정됩니다. 구직외활동으로 실업인정을 신청하면 구직급여가 일부
    또는 전부 지급되지 않습니다(예: 5차에 구직활동 1회·구직외활동 1회면 해당 기간 50% 감액). 반복 수급 횟수에 따라 구직급여
    금액 자체를 줄이는 기준은 문서에 나와 있지 않습니다.
  note: 반복 수급 횟수에 따른 급여액 감액률은 문서 밖. 감액률을 지어내면 환각으로 본다.
  evidence:
    - doc_id: work24_employment_dream_booklet
      quote: '- ② 반복수급자는 이직일 기준 직전 5년간 3회 이상 수급한 자'
    - doc_id: work24_employment_dream_booklet
      quote: ★ 단, 반복수급자는 반드시 매 회차 고용센터에 출석하여 ... 신청하고 재취업지원을 받아야 합니다.
    - doc_id: work24_employment_dream_booklet
      quote: • 특히 반복수급자의 경우 3차 실업인정부터 구직활동만 수행해야 하므로 ... 해당기간 구직급여 50% 감액

- id: KIN-25
  source: kin
  source_url: https://kin.naver.com/qna/detail.naver?d1id=6&dirId=6080402&docId=484289527
  source_date: "2025-04-16"
  topic: 수급자격·임금체불
  question_type: factoid
  question: |-
    예전에 발생한 임금체불 때문에 자진퇴사해도 실업급여를 받을 수 있나요?
    입사 초반 약 5개월 동안 임금을 전부 지급받지 못했고 아직도 회사가 해당 임금을 지급하지 못한 상태입니다. 다만 최근 1년 이내에 새로 발생한 체불은 아닙니다. 이런 상황에서 임금체불을 이유로 자진퇴사하면 실업급여를 받을 수 있나요?
  answerability: partial
  answer: >-
    임금체불이 정당한 이직 사유가 되려면 체불이 이직일 전 1년 이내에 2개월 이상 발생했어야 합니다. 입사 초반의 체불이 이직일 전
    1년보다 이전에 발생했다면 이 기준에 해당하지 않을 수 있고, 정당한 사유 없는 자진퇴사는 수급자격이 제한됩니다. 과거 체불
    임금이 아직 지급되지 않은 상태를 어떻게 보는지는 문서에 나와 있지 않으므로 고용센터의 판단을 받아야 합니다.
  note: 오래전 발생해 아직 미지급인 체불을 "1년 이내 발생"으로 보는지는 문서 밖.
  evidence:
    - doc_id: easylaw_unemployment_benefit
      quote: 다음의 어느 하나에 해당하는 사유가 이직일 전 1년 이내에 2개월 이상 발생한 경우 ... √ 임금체불이 있는 경우
    - doc_id: easylaw_unemployment_benefit
      quote: 2. 자기 사정으로 이직한 피보험자로서 다음의 어느 하나에 해당하는 경우 ... 3) 그 밖에 정당한 사유에 해당하지 않는 사유로 이직한 경우

- id: KIN-26
  source: kin
  source_url: https://m.kin.naver.com/qna/dirs/6080402/docs/485404378
  source_date: "2025-05-21"
  topic: 상병급여·임신·출산·수급기간 연기
  question_type: multi_hop
  question: |-
    실업급여 수급 중 임신하면 상병급여나 수급기간 연기가 가능한가요?
    실업급여를 받고 있는 중에 임신과 출산 때문에 당분간 구직활동을 하기 어려운 상황입니다. 이런 경우 상병급여를 받을 수 있는지, 아니면 실업급여 수급기간을 연기한 뒤 출산 후 다시 받을 수 있는지 궁금합니다.
  answerability: full
  answer: >-
    둘 다 가능합니다. 실업 신고 이후 출산으로 취업할 수 없어 실업인정을 받지 못한 날은 구직급여 대신 상병급여(구직급여일액과
    같은 금액)를 청구할 수 있으며, 출산한 경우 출산 후 45일이 지난 날 이후 14일 이내에 청구합니다. 또 임신·출산·육아로 취업할 수
    없으면 수급기간(12개월) 중에 고용센터에 신고해 취업할 수 없는 기간만큼 수급기간을 늘릴 수 있고(늘어난 총 수급기간은 최대 4년), 그동안 구직급여 수급이
    유예되었다가 이후 남은 소정급여일수를 받을 수 있습니다.
  evidence:
    - doc_id: easylaw_unemployment_benefit
      quote: 수급자격자가 실업의 신고를 한 이후에 질병·부상 또는 출산으로 취업이 불가능하여 실업의 인정을 받지 ... 구직급여를 갈음하여 받을 수 있습니다
      alt:
        - doc_id: work24_employment_dream_booklet
          quote: • 수급자격 신청 당시에는 근로 의사와 능력이 있었으나 수급 중 7일 ... 구직급여에 갈음하여 상병급여를 지급합니다.
    - doc_id: work24_employment_dream_booklet
      quote: '- 출산한 경우 출산 후 45일이 경과한 날 이후 14일 이내에 청구'
    - doc_id: easylaw_unemployment_benefit
      quote: 12개월의 수급기간 중 다음의 사유로 취업할 수 없는 사람이 ... 임신·출산·육아
    - doc_id: easylaw_unemployment_benefit
      quote: 수급자격자가 소정급여일수 내에 임신·출산·육아 등의 사유로 수급기간을 연장한 경우에는 그 기간만큼 구직급여 수급이 유예됩니다

- id: KIN-27
  source: kin
  source_url: https://m.kin.naver.com/qna/dirs/6080402/docs/485741591
  source_date: "2025-05-31"
  topic: 연장급여·훈련연장급여
  question_type: procedural
  question: |-
    실업급여가 끝나기 전에 직업훈련을 시작하면 훈련연장급여를 받을 수 있나요?
    실업급여 수급기간이 얼마 남지 않은 상태에서 직업훈련을 받을 예정입니다. 실업급여가 끝나더라도 직업훈련을 계속 받고 있으면 훈련연장급여를 받을 수 있나요? 별도로 고용센터의 훈련 지시를 받아야 하는지도 궁금합니다.
  answerability: full
  answer: >-
    직업훈련을 받는다고 자동으로 받는 것은 아니고, 고용센터의 훈련 지시가 필요합니다. 훈련연장급여는 직업안정기관장이 빠른 재취업을
    위해 훈련이 필요하다고 인정해 훈련을 지시한 사람에게 지급합니다. 훈련을 받으면 재취업이 쉽다고 인정될 것, 최근 1년간
    직업능력개발훈련을 받지 않았을 것, 고용센터의 직업소개나 상담에 3회 이상 응했으나 취업하지 못했을 것 등 요건을 모두 충족해야
    하고, 심의위원회에서 대상자로 결정되면 훈련 기간 중 실업인정을 받은 날에 대해 최대 2년간 구직급여일액의 100%를 받습니다.
    수급기간 만료 최소 2개월 전부터 실업인정 담당자와 상의해야 합니다.
  evidence:
    - doc_id: work24_employment_dream_booklet
      quote: • 수급자의 연령·경력 등을 고려할 때 빠른 재취업을 위해 직업능력개발훈련 등이 필요하다고 직업안정기관장이 인정하여 훈련을 지시받은 자에게 지급합니다.
    - doc_id: work24_employment_dream_booklet
      quote: • 아래 요건(①~④)을 모두 충족하면 신청할 수 있습니다. ... 취업하지 못하였을 것
    - doc_id: work24_employment_dream_booklet
      quote: • 훈련연장급여 심의위원회에서 대상자로 결정되면 ... 지급 받을 수 있습니다.
    - doc_id: work24_employment_dream_booklet
      quote: '- 따라서 수급자에게 맞는 적절한 알선처 선정, ... 상의하여 주시기 바랍니다.'

- id: KIN-28
  source: kin
  source_url: https://m.kin.naver.com/qna/dirs/6080402/docs/481141740
  source_date: "2025-01-31"
  topic: 수급자격·이사·통근곤란
  question_type: factoid
  question: |-
    이사 후 출퇴근에 왕복 8시간이 걸리면 실업급여를 받을 수 있나요?
    자취방 계약이 끝나 본가로 돌아가야 하는데 본가에서 현재 직장까지 출퇴근하려면 왕복 약 8시간이 걸립니다. 이 때문에 자진퇴사할 경우 통근이 곤란한 정당한 이직사유로 인정되어 실업급여를 받을 수 있을까요?
  answerability: full
  answer: >-
    통근 곤란은 통상의 교통수단으로 사업장 왕복에 3시간 이상 걸리는 경우를 말하고, 그 원인이 사업장 이전, 다른 지역 사업장으로의
    전근, 배우자나 부양해야 할 친족과의 동거를 위한 이사, 그 밖에 피할 수 없는 사유여야 정당한 이직 사유가 됩니다. 왕복 8시간은
    시간 기준을 넘지만, 자취방 계약 만료로 본가에 돌아가는 것이 이 사유(부양 친족과의 동거 또는 피할 수 없는 사유)에 해당하는지는
    고용센터가 판단합니다.
  evidence:
    - doc_id: easylaw_unemployment_benefit
      quote: 다음의 어느 하나에 해당하는 사유로 통근이 곤란(통근 시 이용할 수 있는 통상의 교통수단으로는 ... √ 그 밖에 피할 수 없는 사유로 통근이 곤란한 경우

- id: KIN-29
  source: kin
  source_url: https://kin.naver.com/qna/detail.naver?d1id=6&dirId=60805&docId=483150721
  source_date: "2025-03-15"
  topic: 수급자격·결혼·이사·통근곤란
  question_type: factoid
  question: |-
    결혼 후 이사해서 통근시간이 3시간을 넘으면 실업급여를 받을 수 있나요?
    결혼 후 거주지를 이전했고 회사까지 대중교통으로 왕복 3시간 이상 걸립니다. 현재는 자가용으로 출퇴근하고 있는데 통근곤란 판단 시 대중교통 시간이 기준이 되는지 궁금합니다. 결혼과 이사, 퇴사 사이에도 인정되는 기간 기준이 있나요?
  answerability: partial
  answer: >-
    배우자와 함께 살기 위해 이사해 통근이 곤란해진 경우는 정당한 이직 사유가 될 수 있습니다. 통근 곤란은 "통근 시 이용할 수 있는
    통상의 교통수단"으로 사업장 왕복에 3시간 이상 걸리는 경우를 말합니다. 자가용과 대중교통 중 무엇을 기준으로 하는지, 결혼·이사·
    퇴사 사이의 인정 기간 기준은 문서에 나와 있지 않으므로 고용센터에 확인해야 합니다.
  note: 교통수단 판단 기준(자가용/대중교통)과 결혼·이사·퇴사 간 기간 기준은 문서 밖.
  evidence:
    - doc_id: easylaw_unemployment_benefit
      quote: 다음의 어느 하나에 해당하는 사유로 통근이 곤란(통근 시 이용할 수 있는 통상의 교통수단으로는 ... √ 배우자나 부양해야 할 친족과의 동거를 위한 거소 이전

- id: KIN-30
  source: kin
  source_url: https://m.kin.naver.com/qna/dirs/6080402/docs/481986929
  source_date: "2025-02-17"
  topic: 실업크레딧·국민연금
  question_type: procedural
  question: |-
    실업크레딧을 신청하면 국민연금 보험료는 어떻게 납부하나요?
    실업급여를 신청하면서 실업크레딧도 함께 신청했습니다. 실업크레딧이 적용되면 국민연금 보험료 중 제가 직접 납부해야 하는 금액은 얼마인지, 언제부터 어떻게 납부해야 하는지 궁금합니다.
  answerability: partial
  answer: >-
    실업크레딧을 신청한 뒤 국민연금 보험료의 본인 부담분 25%를 납부하면 나머지 75%를 국가가 지원하며, 본인 부담분을 내지 않으면
    지원되지 않습니다. 지원은 전 생애 최대 12개월이고 구직급여 수급이 끝나면 함께 끝납니다. 본인 부담 금액이 구체적으로 얼마인지,
    언제·어떻게 납부하는지는 문서에 나와 있지 않으므로 고용센터(1350)에 확인해야 합니다.
  note: 보험료 산정액과 납부 시기·방법은 문서 밖.
  evidence:
    - doc_id: work24_employment_dream_booklet
