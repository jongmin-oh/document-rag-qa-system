- id: KIN-31
  source: kin
  source_url: https://m.kin.naver.com/qna/dirs/60804/docs/483070767
  source_date: "2025-03-13"
  topic: 퇴직금·실업급여 복합질문
  question_type: multi_hop
  question: |-
    실업급여 신청 전에 퇴직금을 받아도 문제없나요?
    기존 회사를 자진퇴사하고 한 달 단기알바를 시작합니다. 단기알바 계약종료 후 실업급여를 신청하려고 하는데, 알바를 시작한 이후에 이전 회사에서 밀린 급여와 퇴직금이 입금될 예정입니다. 단기알바 근무기간 중 전 직장의 퇴직금을 받아도 실업급여 신청에 문제가 없나요?
  answerability: partial
  answer: >-
    퇴직금을 받는 것이 실업급여 신청에 영향을 주는지는 문서에 나와 있지 않습니다. 수급자격은 원칙적으로 마지막으로 이직한 사업(단기알바
    계약종료)을 기준으로 판단하고, 계약기간 만료는 정당한 이직 사유입니다. 다만 1개월 미만 고용되는 사람은 일용근로자에 해당하며,
    일용근로자로서 피보험 단위기간이 1개월 미만인 사람이 수급자격을 갖추지 못하면 일용근로자가 아닌 근로자로서 마지막으로 이직한
    사업(자진퇴사한 이전 회사)을 기준으로 판단하므로 수급자격이 제한될 수 있습니다.
  note: 퇴직금 수령과 실업급여의 관계는 문서 밖. 단기알바 뒤 수급자격 판단은 KIN-11과 같은 규칙.
  evidence:
    - doc_id: easylaw_unemployment_benefit
      quote: 수급자격의 인정 신청인이 다음의 요건을 모두 갖춘 경우에는 마지막에 이직(離職)한 사업을 기준으로 ... 마지막 이직 이전의 이직과 관련하여 구직급여를 받은 사실이 없을 것
    - doc_id: easylaw_unemployment_benefit
      quote: 정년의 도래나 계약기간의 만료로 회사를 계속 다닐 수 없게 된 경우
    - doc_id: easylaw_unemployment_benefit
      quote: 다만, 마지막 이직 당시 일용근로자로서 피보험 단위기간이 1개월 미만인 사람이 수급자격을 갖추지 못한 ... 1개월 미만 동안 고용되는 사람을 말합니다

- id: KIN-32
  source: kin
  source_url: https://m.kin.naver.com/qna/dirs/60804/docs/482542478
  source_date: "2025-03-01"
  topic: 육아휴직급여
  question_type: unanswerable
  question: |-
    2025년 육아휴직급여는 월급에 따라 얼마를 받나요?
    2025년 기준으로 세전 월급이 300만원일 때 받는 금액, 250만원일 때 받는 금액, 200만원일 때 받는 금액을 알려주세요.
  answerability: none
  answer: >-
    육아휴직 급여는 실업급여와 별도의 제도로, 금액 기준이 제공된 문서에 나와 있지 않습니다. 고용노동부 고객상담센터(1350)에 문의해야 합니다.
  note: 생활법령 1.1.1절에 "고용보험사업에는 ... 육아휴직 급여"라는 언급만 있어 검색될 수 있으나 금액 기준은 없다.
  evidence: []

- id: KIN-33
  source: kin
  source_url: https://m.kin.naver.com/qna/dirs/6100401/docs/483059346
  source_date: "2025-03-13"
  topic: 건강보험·임의계속가입
  question_type: unanswerable
  question: |-
    실업급여를 받는 동안 건강보험 임의계속가입을 하는 게 유리한가요?
    2월에 퇴사하면서 5개월간 실업급여를 받게 되었습니다. 직장가입자에서 지역가입자로 변경됐는데 임의계속가입 시 보험료가 92,060원이고 지역가입자로 있으면 22,340원으로 나옵니다. 이런 경우 임의계속가입을 하지 않고 지역가입자로 있는 게 나은 건가요?
  answerability: none
  answer: >-
    건강보험 임의계속가입과 지역가입자 보험료는 국민건강보험 제도로, 제공된 문서에 나와 있지 않습니다. 국민건강보험공단에 문의해야 합니다.
  note: 실업급여 수급자의 질문이지만 판단 대상은 건강보험 제도다.
  evidence: []

- id: KIN-34
  source: kin
  source_url: https://m.kin.naver.com/qna/dirs/60804/docs/481795859
  source_date: "2025-02-13"
  topic: 국민취업지원제도·내일배움카드
  question_type: factoid
  question: |-
    실업급여 받으면서 국민취업지원제도와 내일배움카드를 같이 이용할 수 있나요?
    현재 실업급여를 받고 있습니다. 구직활동을 위해 내일배움카드를 만들려고 하는데 국민취업지원제도도 같이 지원할 수 있나요? 같이 신청하면 지원금이나 구직활동해야 할 사항들이 더 많아지나요?
  answerability: partial
  answer: >-
    국민내일배움카드는 국민 누구나 신청할 수 있고, 구직급여 수급자는 고용24 구직신청을 해야 합니다. 수급 중 받는 직업훈련은 구직
    희망 직종과 관련 있고 출결관리가 되는 과정이면 재취업활동으로 인정됩니다. 국민취업지원제도와 함께 참여할 수 있는지, 함께 신청하면
    지원금이나 의무가 어떻게 달라지는지는 제공된 문서에 나와 있지 않으므로 고용센터(1350)에 확인해야 합니다.
  note: 내일배움카드 신청과 훈련의 재취업활동 인정은 수첩에 있다. 국민취업지원제도 병행 기준은 문서 밖.
  evidence:
    - doc_id: work24_employment_dream_booklet
      quote: '### 1. 국민내일배움카드 ... (구직급여 수급자인 경우 고용24 구직신청 필수)'
    - doc_id: work24_employment_dream_booklet
      quote: 직업훈련은 구직외활동이나, 수급자의 구직희망 직종과 관련이 있으며 ... 구직활동 횟수를 충족한 것으로 인정됩니다.

- id: KIN-35
  source: kin
  source_url: https://m.kin.naver.com/qna/dirs/403/docs/484278661
  source_date: "2025-04-16"
  topic: 세금·종합소득세
  question_type: unanswerable
  question: |-
    퇴직 후 실업급여를 받았는데 종합소득세 신고를 어떻게 해야 하나요?
    작년 9월 퇴사 후 퇴직금 2,400만원, 위로금 1,000만원을 받았고 실업급여도 5개월 동안 받았습니다. 퇴사 전 근로소득은 2,800만원이고 올해 다시 취업했습니다. 5월 종합소득세 신고를 해본 적이 없는데 어떻게 신고해야 하나요?
  answerability: none
  answer: >-
    종합소득세 신고 방법과 퇴직금·위로금의 세금 처리는 제공된 문서에 나와 있지 않습니다. 국세청(126)이나 세무 전문가에게 문의해야 합니다.
  note: >-
    생활법령의 "실업급여에는 국가나 지방자치단체의 공과금이 부과되지 않는다"(「고용보험법」 제38조의2) 조항이 검색될 수 있다.
    이 조항만으로는 종합소득세 신고 방법이나 퇴직금·위로금의 과세 여부를 판단할 수 없으므로, 이를 근거로 신고 방법을 답하면 틀린 것으로 본다.
  evidence: []

